name: Firmware CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  behavioral-tests:
    name: Behavioral tests
    runs-on: codebuild-knowco2-firmware-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce private CodeBuild runner policy
        run: python3 tools/check_ci_runner_policy.py

      - name: Verify locked CircuitPython dependencies
        run: python3 tools/firmware_dependencies.py verify

      - name: Compile all firmware modules
        run: python3 -m py_compile $(find . -name "*.py" -not -path "./tests/*" -not -path "./.git/*")

      - name: Remove compile artifacts
        run: find . -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true

      - name: Run every hardware-free suite in an isolated interpreter
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 tools/run_tests.py
