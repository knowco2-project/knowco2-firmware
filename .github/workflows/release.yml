name: Build and Release KnowCO2 Firmware

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build-release:
    runs-on:
      - codebuild-knowco2-firmware-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags for the version-bump guard

      # ------------------------------------------------------------------ #
      # Determine the release version
      # ------------------------------------------------------------------ #
      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building release: $VERSION"

      # ------------------------------------------------------------------ #
      # Gate: compile everything and run the hardware-free test suites
      # before building anything. (The OTA-installer suite needs a root
      # container and runs in ci.yml on PRs instead — CodeBuild runners
      # don't support job containers.)
      # ------------------------------------------------------------------ #
      - name: Compile all firmware modules
        run: python3 -m py_compile $(find . -name "*.py" -not -path "./tests/*" -not -path "./.git/*")

      # py_compile writes __pycache__/*.pyc next to every module it checks
      # (PYTHONDONTWRITEBYTECODE does NOT suppress this — that only
      # affects import-time caching, not py_compile's explicit output).
      # These must not leak into any staged package below: each one adds
      # bytes and a file-count entry that eats into the CIRCUITPY budget
      # for nothing. Confirmed by hand that py_compile creates these even
      # with the env var set, so clean up explicitly instead.
      - name: Remove __pycache__ created by the compile gate
        run: find . -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true

      - name: Run behavioral test suites
        working-directory: tests
        run: |
          python3 test_cloud_heal.py
          python3 test_snappy_ui.py
          python3 test_graph_perf.py
          python3 test_buttons.py

      # ------------------------------------------------------------------ #
      # Gate: the tag must match the firmware version actually in the tree
      # (prevents publishing vX.Y.Z containing an unbumped version.py)
      # ------------------------------------------------------------------ #
      - name: Verify version.py was bumped for this release
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          if ! grep -q "FIRMWARE_VERSION" knowco2/version.py; then
            echo "::error::knowco2/version.py missing FIRMWARE_VERSION"; exit 1
          fi
          if git log -1 --format=%s | grep -qi "release"; then :; fi
          # The version string must have changed in the commit history
          # reachable from this tag relative to the previous release tag.
          PREV=$(git tag --sort=-creatordate | grep -v "^${VERSION}$" | head -1 || true)
          if [ -n "$PREV" ] && git diff --quiet "$PREV" HEAD -- knowco2/version.py; then
            echo "::error::knowco2/version.py unchanged since $PREV — bump FIRMWARE_VERSION before tagging $VERSION"
            exit 1
          fi
          echo "version.py check passed"

      # ------------------------------------------------------------------ #
      # Package 1 — OTA ZIP
      # What the user uploads to http://knowco2-XXXX.local/update
      # Contains everything except the lib/ directory (smaller download;
      # lib rarely changes between releases).
      # ------------------------------------------------------------------ #
      - name: Build OTA ZIP
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          STAGING="staging-ota"
          mkdir -p "$STAGING"

          cp code.py boot.py "$STAGING/"
          cp -r knowco2 "$STAGING/"
          cp -r assets "$STAGING/"

          cd "$STAGING"
          zip -r "../knowco2-ota-${VERSION}.zip" .
          cd ..

          echo "OTA ZIP contents:"
          unzip -l "knowco2-ota-${VERSION}.zip"

      # ------------------------------------------------------------------ #
      # Package 2 — Dev ZIP (editable source)
      # For developers who want to edit knowco2/*.py live on the device
      # over USB without recompiling. NOT what factory/production flashing
      # should use — see Package 2b below, which is what the KnowCO2
      # Flasher actually fetches under the name "full".
      # ------------------------------------------------------------------ #
      - name: Build Dev ZIP
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          STAGING="staging-dev"
          mkdir -p "$STAGING/lib"

          cp code.py boot.py "$STAGING/"
          cp -r knowco2 "$STAGING/"
          cp -r assets "$STAGING/"

          # Use the versioned lib snapshot if present, otherwise fall back to lib/
          LIB_DIR=$(ls -d lib-*-release 2>/dev/null | sort -r | head -1)
          if [ -z "$LIB_DIR" ]; then
            LIB_DIR="lib"
          fi
          echo "Using lib directory: $LIB_DIR"
          cp -r "$LIB_DIR/." "$STAGING/lib/"

          cd "$STAGING"
          zip -r "../knowco2-dev-${VERSION}.zip" .
          cd ..

          echo "Dev ZIP contents:"
          unzip -l "knowco2-dev-${VERSION}.zip"

      # ------------------------------------------------------------------ #
      # Fetch mpy-cross matching this board's CircuitPython version. Used
      # below to compile knowco2/ to bytecode for the space-optimized
      # Production ZIP. This MUST be CircuitPython's own mpy-cross, not
      # pip/PyPI's "mpy-cross" package — that one targets MicroPython.
      # Both emit .mpy format version 6, but CircuitPython's build stamps
      # files with magic byte "C" and MicroPython's with "M" — they are
      # not interchangeable, and the board will refuse (or worse, mis-load)
      # a "M"-tagged file. If CircuitPython is upgraded, bump CP_VERSION
      # here to match (and the .uf2 under circuitpython-release/).
      # ------------------------------------------------------------------ #
      - name: Fetch mpy-cross (CircuitPython)
        run: |
          # Recent CircuitPython releases no longer attach mpy-cross to the
          # GitHub release (only 2 auto-generated source assets are there).
          # The real binaries live in Adafruit's own S3 bucket, one per
          # platform/version, e.g.:
          #   bin/mpy-cross/linux-amd64/mpy-cross-linux-amd64-10.2.1.static
          # Confirmed present for 10.2.1 by listing the bucket directly.
          CP_VERSION="10.2.1"
          curl -fL -o mpy-cross \
            "https://adafruit-circuit-python.s3.amazonaws.com/bin/mpy-cross/linux-amd64/mpy-cross-linux-amd64-${CP_VERSION}.static"
          chmod +x mpy-cross
          ./mpy-cross --version

      # ------------------------------------------------------------------ #
      # Package 2b — Full ZIP (space-optimized, factory install)
      # knowco2/ is compiled to .mpy bytecode instead of shipped as .py
      # source, so the whole package fits the approved 960 KB CIRCUITPY
      # budget. This ships as knowco2-full-*.zip because the KnowCO2
      # Flasher's source policy fetches "latest published KnowCO2 full
      # release" by that exact name — it does not know about "production"
      # or "dev" as package types. If that Flasher policy ever changes,
      # revisit this naming.
      # code.py / boot.py stay as .py — they're the entry point, and
      # code.py is validated as text during OTA installs.
      # ------------------------------------------------------------------ #
      - name: Build Full ZIP
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          STAGING="staging-full"
          mkdir -p "$STAGING/lib"

          cp code.py boot.py "$STAGING/"
          cp -r knowco2 "$STAGING/"
          cp -r assets "$STAGING/"

          # Compile the package to bytecode, then drop the .py source.
          # version.py is exempted: the KnowCO2 Flasher (and our own
          # "Get firmware version string" step above) reads it as plain
          # text to find FIRMWARE_VERSION before/after flashing. It's
          # ~700 bytes — leaving it uncompiled costs nothing.
          find "$STAGING/knowco2" -name "*.py" ! -name "version.py" | while read -r f; do
            ./mpy-cross "$f" -o "${f%.py}.mpy"
            rm "$f"
          done

          # Gate: every module except version.py must have compiled —
          # never ship a partially compiled package
          remaining=$(find "$STAGING/knowco2" -name "*.py" ! -name "version.py" | wc -l)
          if [ "$remaining" -ne 0 ]; then
            echo "::error::${remaining} knowco2/*.py file(s) failed to compile to .mpy"
            find "$STAGING/knowco2" -name "*.py" ! -name "version.py"
            exit 1
          fi

          # Sanity check: version.py must still be present and readable
          if [ ! -f "$STAGING/knowco2/version.py" ] || ! grep -q "FIRMWARE_VERSION" "$STAGING/knowco2/version.py"; then
            echo "::error::knowco2/version.py missing or unreadable in Full ZIP staging"
            exit 1
          fi

          # Use the same lib snapshot as the Dev ZIP
          LIB_DIR=$(ls -d lib-*-release 2>/dev/null | sort -r | head -1)
          if [ -z "$LIB_DIR" ]; then
            LIB_DIR="lib"
          fi
          echo "Using lib directory: $LIB_DIR"
          cp -r "$LIB_DIR/." "$STAGING/lib/"

          cd "$STAGING"
          zip -r "../knowco2-full-${VERSION}.zip" .
          cd ..

          echo "Full ZIP contents:"
          unzip -l "knowco2-full-${VERSION}.zip"

      # ------------------------------------------------------------------ #
      # Package 3 — Source ZIP
      # Clean source tree without git internals, build artifacts, or
      # macOS junk — useful for developers who want to read / modify code.
      # ------------------------------------------------------------------ #
      - name: Build Source ZIP
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          STAGING="staging-src"
          mkdir -p "$STAGING"

          rsync -a \
            --exclude=".git" \
            --exclude=".github" \
            --exclude=".DS_Store" \
            --exclude="staging-*" \
            --exclude="*.zip" \
            . "$STAGING/"

          cd "$STAGING"
          zip -r "../knowco2-source-${VERSION}.zip" .
          cd ..

          echo "Source ZIP contents:"
          unzip -l "knowco2-source-${VERSION}.zip"

      # ------------------------------------------------------------------ #
      # Generate SHA-256 checksums for all artifacts
      # ------------------------------------------------------------------ #
      - name: Generate checksums
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          sha256sum \
            "knowco2-ota-${VERSION}.zip" \
            "knowco2-full-${VERSION}.zip" \
            "knowco2-dev-${VERSION}.zip" \
            "knowco2-source-${VERSION}.zip" \
            > "knowco2-${VERSION}-checksums.txt"
          cat "knowco2-${VERSION}-checksums.txt"

      # ------------------------------------------------------------------ #
      # Extract firmware version string for the release notes
      # ------------------------------------------------------------------ #
      - name: Get firmware version string
        id: fw_version
        run: |
          FW_VER=$(python3 -c "
          import re, sys
          content = open('knowco2/version.py').read()
          m = re.search(r'FIRMWARE_VERSION\s*=\s*[\"\'](.*?)[\"\']', content)
          print(m.group(1) if m else 'unknown')
          ")
          echo "FW_VER=$FW_VER" >> $GITHUB_OUTPUT
          echo "Firmware version string: $FW_VER"

      # ------------------------------------------------------------------ #
      # Create GitHub Release
      # ------------------------------------------------------------------ #
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          FW_VER="${{ steps.fw_version.outputs.FW_VER }}"

          gh release create "$VERSION" \
            --title "KnowCO2 Firmware $VERSION ($FW_VER)" \
            --notes "$(cat <<'NOTES'
          ## Installation options

          | File | Use when |
          |---|---|
          | `knowco2-full-*.zip` | Fresh install on a factory/blank device — unzip onto your `CIRCUITPY` drive. Space-optimized (knowco2/ compiled to .mpy) to fit the 960 KB CIRCUITPY budget. **This is what the KnowCO2 Flasher fetches automatically.** |
          | `knowco2-dev-*.zip` | Fresh install or upgrade for developers who want to edit `knowco2/*.py` live on the device — plain, editable source instead of compiled bytecode. Larger; may not fit factory-blank boards. |
          | `knowco2-ota-*.zip` | OTA upgrade — upload at `http://knowco2-XXXX.local/update` |
          | `knowco2-source-*.zip` | Source code — for developers who want to read or modify the firmware |

          ## Installing CircuitPython (first time only)
          The device needs CircuitPython **10.x** before this firmware will run.
          Download the `.uf2` for the [Adafruit Feather ESP32-S3 Reverse TFT](https://circuitpython.org/board/adafruit_feather_esp32s3_reverse_tft/), double-tap reset to enter the bootloader, drag the `.uf2` onto the `FTHRS3BOOT` drive, then install this firmware using the full ZIP above.

          ## Checksums
          See `*-checksums.txt` attached below to verify your download.
          NOTES
          )" \
            "knowco2-full-${VERSION}.zip" \
            "knowco2-dev-${VERSION}.zip" \
            "knowco2-ota-${VERSION}.zip" \
            "knowco2-source-${VERSION}.zip" \
            "knowco2-${VERSION}-checksums.txt"

      # ------------------------------------------------------------------ #
      # Summary
      # ------------------------------------------------------------------ #
      - name: Release summary
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          echo "=========================================="
          echo "  Release $VERSION published successfully"
          echo "=========================================="
          echo "  Full ZIP (factory/Flasher): knowco2-full-${VERSION}.zip"
          echo "  Dev ZIP (editable source):  knowco2-dev-${VERSION}.zip"
          echo "  OTA ZIP:    knowco2-ota-${VERSION}.zip"
          echo "  Source ZIP: knowco2-source-${VERSION}.zip"
          echo "  Checksums:  knowco2-${VERSION}-checksums.txt"
          echo "=========================================="
