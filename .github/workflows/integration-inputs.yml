name: Integration input snapshots

on:
  push:
    branches: [integration/firmware-1.0.0]
    paths: [.github/workflows/integration-inputs.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-inputs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshots:
    if: github.ref == 'refs/heads/integration/firmware-1.0.0'
    runs-on: codebuild-knowco2-firmware-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export pinned public integration inputs (no credentials or working files)
        shell: bash
        run: |
          set -euo pipefail
          test "${CODEBUILD_BUILD_ID:-}" != ""
          mkdir -p integration-inputs
          for item in \
            main:aa7533ca40be5fa352a77f2f550dfbd0dfdd2e7e \
            pr22:93f2ed67fb19aecde60db30a9f7cff822c599b4c \
            pr23:edfe344f7678822ae809429bfce8edb0008419ce \
            pr24:e0691b809d55c2dced8d9906525035f9cddd5e3f \
            pr25:6b8826b430752c23ce4d3888d157a34cf290b606
          do
            name="${item%%:*}"
            sha="${item#*:}"
            test "$(git rev-parse "${sha}^{commit}")" = "$sha"
            git archive --format=zip --output="integration-inputs/${name}-${sha}.zip" "$sha"
            printf '%s %s\n' "$name" "$sha" >> integration-inputs/commits.txt
          done
          (cd integration-inputs && sha256sum *.zip > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-inputs-${{ github.run_id }}
          path: integration-inputs/
          retention-days: 7
          if-no-files-found: error
